<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Tic Tac Toe</title>
        <script>
            // Single Page Apps for GitHub Pages
            // https://github.com/rafgraph/spa-github-pages
            // 0 when served from the apex of a custom domain. Must match the
            // Vite `base` setting (default '/' -> 0 segments).
            var pathSegmentsToKeep = 0;
            var l = window.location;
            l.replace(
                l.protocol +
                    '//' +
                    l.hostname +
                    (l.port ? ':' + l.port : '') +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join('/') +
                    '/?/' +
                    l.pathname
                        .slice(1)
                        .split('/')
                        .slice(pathSegmentsToKeep)
                        .join('/')
                        .replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
            );
        </script>
    </head>
    <body></body>
</html>
